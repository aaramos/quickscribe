# QuickScribe sidecar configuration — the ONLY place model names are pinned.
# The app (frontend) never reads this file; only the sidecar does.

[stt]
# STT backend:
#   "omlx"  = transcribe via the oMLX server /v1/audio/transcriptions — any
#             STT model in oMLX's store (AI RAID) works; no HF cache, no
#             external drive. DEFAULT since 2026-11-03 (the HF cache lived on
#             a disconnected external volume and 500'd every chunk).
#   "local" = mlx-whisper against a local weights dir (HF repo id or path).
backend = "omlx"
# omlx: the model id exactly as oMLX reports it in /v1/models (bare name).
# local: HF repo id or a local model dir path.
# STARTUP DEFAULT; the menu-bar Transcription Model picker can hot-swap it at
# runtime (choice persists app-side; re-applied on launch).
model_id = "whisper-large-v3-turbo-4bit"
language = "en"
# Curated candidates for the picker (GET /stt/models). The omlx backend adds
# anything STT-looking from oMLX's live /models list on top of these; the
# local backend appends whisper repos found in the HF cache.
models = [
  "whisper-large-v3-turbo-4bit",
  "Qwen3-ASR-1.7B-8bit",
  "parakeet-tdt-0.6b-v3",
  "LFM3-Audio-2B-MLX-8bit",
  "whisper-large-v3-8bit",
]

[stt.omlx]
# OpenAI-compatible endpoint — the same server as [llm]. API key comes from
# ~/.omlx/settings.json (auth.api_key), the same source [llm] uses.
base_url = "http://127.0.0.1:1234/v1"
# Per-chunk budget (the app's client timeout is 8 s); startup and model
# switch use a 120 s warm-load regardless.
timeout_s = 20

[llm]
# Local oMLX OpenAI-compatible endpoint. Key read from ~/.omlx/settings.json (auth.api_key).
base_url = "http://127.0.0.1:1234/v1"
# Fast flash-class model for cleanup, verified on this host's oMLX.
# A Qwen3.5-9B build chosen over Qwen3.8-Flash-Next-oQ4e-mtp: the latter has
# reasoning_effort=medium pinned server-side and burns hundreds of thinking
# tokens before any visible output (TTFT 6s+, timeouts under load). The 9B
# produces no reasoning tokens: ~0.65s round-trip for ~50-word polish.
# oQ6e since 2026-10-12 (owner): the oQ8e build is no longer installed on oMLX,
# and naming a missing model made oMLX fall back to its default (Muse-Glimmer).
model = "Qwen3.6-35B-A3B-4bit"
timeout_s = 6
# Periodic 1-token warm ping keeps the model resident in oMLX so the first
# /polish after >=10min idle is not a cold-start.
keepalive_s = 60

[server]
host = "127.0.0.1"
port = 8790

[history]
db_path = "~/Library/QuickScribe/history.sqlite3"
limit = 50

[prompts]
# The user's edited refine-mode prompts. Factory text ships in prompts.py.
path = "~/Library/QuickScribe/prompts.json"
